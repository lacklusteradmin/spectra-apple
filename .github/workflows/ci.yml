name: CI

# The gate for everything that needs no Xcode. The app's suites (`make test-ios`
# and `make test-mac`) need Xcode and stay local; see AGENTS.md. Core's own
# targets run in its repository's CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scans:
    name: Source scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scans read core's sources through the submodule.
          submodules: true

      - name: Tool versions
        run: python3 --version

      # The Makefile is the one list of gates: a scan added there gates here.
      - name: Lint
        run: make lint

  ui:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UI checks
        run: make check-ui
